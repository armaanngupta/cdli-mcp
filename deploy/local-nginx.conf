# Front proxy for local Docker runs, mirroring the routing the framework's nginx will do
# in production. deploy/framework.md is the authority for the production config; this file
# exists so `docker compose up` reproduces same-origin /chat and /chat/api locally.
#
# Docker's embedded DNS. The framework's nginx.conf declares the same resolver at the http
# level, which the `set $var` + `proxy_pass $var` idiom below depends on.
resolver 127.0.0.11 valid=30s;

server {
  listen 8080;
  server_name _;

  location = / {
    return 302 /chat/;
  }

  # Longer prefix wins regardless of block order, so this takes precedence over /chat/.
  location ^~ /chat/api/ {
    set $cdli_chat_proxy_pass "http://app_cdli_chat:8090";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE: without these the stream is buffered and nothing appears until the turn ends,
    # and a /paper run dies at nginx's 60s default read timeout.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    proxy_pass $cdli_chat_proxy_pass;
  }

  location ^~ /chat/ {
    set $cdli_chat_web_proxy_pass "http://app_cdli_chat_web:80";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    rewrite ^/chat/?(.*)$ /$1 break;
    proxy_pass $cdli_chat_web_proxy_pass;
  }

  location ^~ /mcp {
    set $cdli_mcp_proxy_pass "http://app_cdli_mcp:3000";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamable HTTP responses are SSE too.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 600s;

    proxy_pass $cdli_mcp_proxy_pass;
  }
}
