server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The framework's nginx strips the /chat/ prefix before proxying here, so paths
  # arrive at the root. VITE_BASE keeps the browser asking for /chat/-prefixed assets.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
