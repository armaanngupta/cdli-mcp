<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CDLI Artifacts</title>
    <style>
      /* Palette and type mirror cdli.earth (main.css tokens: --cdli-blue, --gunmetal,
         --foggy-grey; Open Sans body, radius 0), duplicated from inscription.html so
         each app stays self-contained. Open Sans itself can't be @imported — the
         MCP Apps CSP blocks external hosts — so the stack falls back to close
         system faces when it isn't installed. */
      :root {
        --paper: #fff;
        --ink: #212529;
        --muted: #495057;
        --panel: #f7f7f7;
        --panel-edge: #dee2e6;
        --blue: #1661ab;
        --chip-bg: #eee;
      }
      [data-theme='dark'] {
        --paper: #1a1c1f;
        --ink: #e4e6e9;
        --muted: #9aa2ab;
        --panel: #24262a;
        --panel-edge: #383b40;
        --blue: #4e94dd;
        --chip-bg: #2b2e33;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --paper: #1a1c1f;
          --ink: #e4e6e9;
          --muted: #9aa2ab;
          --panel: #24262a;
          --panel-edge: #383b40;
          --blue: #4e94dd;
          --chip-bg: #2b2e33;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px/1.6 'Open Sans',
          'Segoe UI',
          system-ui,
          Helvetica,
          Arial,
          sans-serif;
      }
      #root {
        padding: 14px 16px;
        max-width: 1080px;
      }
      .cat {
        display: flex;
        gap: 6px 10px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .total {
        font-size: 13px;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 12px 14px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
      }
      .card-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .pnum {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 1px 7px;
        border: 1px solid var(--blue);
        color: var(--blue);
        text-decoration: none;
      }
      a.pnum:hover,
      a.pnum:focus-visible {
        background: var(--blue);
        color: var(--paper);
        outline: none;
      }
      .desig {
        font-size: 14.5px;
        font-weight: 700;
        color: var(--blue);
      }
      .facets {
        font-size: 12.5px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 10.5px;
        letter-spacing: 0.05em;
        color: var(--muted);
        padding: 1px 7px;
        background: var(--chip-bg);
        border: 1px solid var(--panel-edge);
      }
      .meta {
        margin-top: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .state {
        font-style: italic;
        font-size: 12.5px;
        color: var(--muted);
      }
      .plain {
        font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
      }
      .wait {
        color: var(--muted);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div id="root"><span class="wait">Loading search results…</span></div>
    <!--__APP_SCRIPT__-->
  </body>
</html>
